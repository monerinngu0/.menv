name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test commands and setup
        run: python3 -m unittest discover -s tests -v
      - name: Check syntax
        run: |
          for script in .bin/setup bootstrap.sh .lib/python.sh; do bash -n "$script"; done
          python3 -m compileall -q .lib envs/setup/.lib
          python3 scripts/build_registry.py --check
          git diff --check
